# Server Configuration
server.port=8080
 # server.servlet.context-path=/api

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/farmer_assistance_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=farmer_user
spring.datasource.password=securePassword123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Logging
logging.level.root=INFO
logging.level.com.farmerassistant=DEBUG

# ========== OLLAMA CONFIG ==========
ollama.api.url=http://127.0.0.1:11434
ollama.model=orca-mini
ollama.timeout=120000

# JWT Configuration
app.jwtSecret=mySecretKeyForKrishiMitraApplicationThatIsVeryLongAndSecure
app.jwtExpirationMs=86400000

spring.main.allow-circular-references=true

# File Upload Size Limit
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB